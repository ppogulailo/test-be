# Deploy backend to Fly.io on push to develop
# See https://fly.io/docs/app-guides/continuous-deployment-with-github-actions/

name: Deploy Backend to Fly.io

on:
  push:
    branches:
      - develop

jobs:
  deploy:
    name: Deploy to Fly.io
    runs-on: ubuntu-latest
    concurrency: deploy-group

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Fly CLI
        uses: superfly/flyctl-actions/setup-flyctl@master

      # If your repo root is the backend (no backend-fer folder), change to: run: flyctl deploy --remote-only -a backend-fer-bold-resonance-3367
      - name: Deploy to Fly.io
        run: flyctl deploy --remote-only -a backend-fer-bold-resonance-3367
        working-directory: backend-fer
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
